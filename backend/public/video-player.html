<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Player</title>
  <style>
    @font-face {
      font-family: 'Sarabun';
      src: url('/fonts/Sarabun-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/fonts/Sarabun-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/fonts/Sarabun-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #020617 0%, #08111f 100%);
      color: var(--text);
      font-family: 'Sarabun', "Noto Sans Thai", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(1100px, 100%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }
    .meta, .note {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .speed-label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .speed-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .speed-btn {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    .speed-btn.active {
      background: #38bdf8;
      color: #04111f;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .note.error {
      color: var(--danger);
    }
    video {
      width: 100%;
      max-height: 72vh;
      margin-top: 16px;
      border-radius: 18px;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1 id="playerTitle">กำลังโหลดวิดีโอ...</h1>
    <div class="meta" id="playerMeta">เตรียม player</div>
    <div class="toolbar">
      <span class="speed-label">ความเร็ว</span>
      <div class="speed-group" id="speedGroup">
        <button class="speed-btn active" type="button" data-speed="1">1x</button>
        <button class="speed-btn" type="button" data-speed="1.25">1.25x</button>
        <button class="speed-btn" type="button" data-speed="1.5">1.5x</button>
        <button class="speed-btn" type="button" data-speed="2">2x</button>
        <button class="speed-btn" type="button" data-speed="3">3x</button>
        <button class="speed-btn" type="button" data-speed="4">4x</button>
        <button class="speed-btn" type="button" data-speed="5">5x</button>
      </div>
    </div>
    <video id="videoPlayer" controls playsinline></video>
    <div class="note" id="playerNote">กำลังโหลด source...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const playbackUrl = params.get('playbackUrl') || '';
    const title = params.get('title') || 'Video Player';
    const playerTitle = document.getElementById('playerTitle');
    const playerMeta = document.getElementById('playerMeta');
    const playerNote = document.getElementById('playerNote');
    const videoPlayer = document.getElementById('videoPlayer');
    const speedGroup = document.getElementById('speedGroup');
    let hlsInstance = null;
    let preferredRate = 1;

    playerTitle.textContent = title;

    function setNote(message, kind = '') {
      playerNote.className = kind ? `note ${kind}` : 'note';
      playerNote.textContent = message;
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function applySpeed(rate) {
      preferredRate = Number(rate) || 1;
      videoPlayer.playbackRate = preferredRate;
      videoPlayer.defaultPlaybackRate = preferredRate;
      speedGroup?.querySelectorAll('[data-speed]')?.forEach((button) => {
        button.classList.toggle('active', String(button.getAttribute('data-speed')) === String(preferredRate));
      });
    }

    async function tryAutoplay() {
      try {
        await videoPlayer.play();
        setNote(`กำลังเล่นอัตโนมัติ • ${preferredRate}x`);
      } catch {
        setNote(`พร้อมเล่นแล้ว • ความเร็ว ${preferredRate}x`);
      }
    }

    function attachSource(payload) {
      destroyHls();
      const posterUrl = payload?.posterUrl || '';
      const hlsUrl = payload?.source?.hls || '';
      const mp4Url = payload?.source?.r2Mp4 || payload?.source?.mp4 || '';
      if (posterUrl) videoPlayer.poster = posterUrl;
      if (!hlsUrl && !mp4Url) {
        playerMeta.textContent = 'no source';
        setNote('ไม่พบ source สำหรับเล่นวิดีโอ', 'error');
        return;
      }
      const canUseNativeHls = typeof videoPlayer.canPlayType === 'function'
        && videoPlayer.canPlayType('application/vnd.apple.mpegurl');
      if (hlsUrl && canUseNativeHls) {
        videoPlayer.src = hlsUrl;
        playerMeta.textContent = 'HLS (native)';
        setNote('กำลังเล่นผ่าน HLS');
        videoPlayer.addEventListener('loadedmetadata', () => {
          applySpeed(preferredRate);
          void tryAutoplay();
        }, { once: true });
        return;
      }
      if (hlsUrl && window.Hls?.isSupported?.()) {
        hlsInstance = new window.Hls({ enableWorker: true, lowLatencyMode: false });
        hlsInstance.loadSource(hlsUrl);
        hlsInstance.attachMedia(videoPlayer);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
          playerMeta.textContent = 'HLS';
          setNote('กำลังเล่นผ่าน HLS');
          applySpeed(preferredRate);
          void tryAutoplay();
        });
        hlsInstance.on(window.Hls.Events.ERROR, (_event, data) => {
          if (data?.fatal && mp4Url) {
            destroyHls();
            videoPlayer.src = mp4Url;
            playerMeta.textContent = 'MP4 fallback';
            setNote('HLS มีปัญหา จึง fallback ไป MP4', 'error');
            videoPlayer.addEventListener('loadedmetadata', () => {
              applySpeed(preferredRate);
              void tryAutoplay();
            }, { once: true });
          }
        });
        return;
      }
      videoPlayer.src = mp4Url;
      playerMeta.textContent = 'MP4';
      setNote('กำลังเล่นผ่าน MP4');
      videoPlayer.addEventListener('loadedmetadata', () => {
        applySpeed(preferredRate);
        void tryAutoplay();
      }, { once: true });
    }

    async function main() {
      if (!playbackUrl) {
        playerMeta.textContent = 'invalid request';
        setNote('ไม่มี playback URL', 'error');
        return;
      }
      try {
        const response = await fetch(playbackUrl, { method: 'GET' });
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload?.error || `เปิดวิดีโอไม่สำเร็จ (${response.status})`);
        }
        attachSource(payload?.data || {});
      } catch (error) {
        playerMeta.textContent = 'load failed';
        setNote(error?.message || 'โหลดวิดีโอไม่สำเร็จ', 'error');
      }
    }

    speedGroup?.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const rate = Number(target.getAttribute('data-speed') || 1);
      applySpeed(rate);
    });

    videoPlayer?.addEventListener('ratechange', () => {
      applySpeed(videoPlayer.playbackRate || preferredRate || 1);
    });

    void main();
  </script>
</body>
</html>
